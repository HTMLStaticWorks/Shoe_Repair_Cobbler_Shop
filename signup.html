<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SoleCraft Cobbler</title>
    <meta name="description" content="Register a client profile to manage your shoe repairs, save preferences, and receive priority drop-off quotes.">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        charcoal: '#171513',
                        leather: '#7c4a27',
                        cognac: '#c87d4a',
                        cream: '#fcf9f2',
                        creamDark: '#e8dfd1',
                        brass: '#d4af37',
                        primary: '#c87d4a',
                        secondary: '#171513',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>

<body class="bg-cream dark:bg-charcoal text-stone-800 dark:text-stone-100 transition-colors duration-300 antialiased flex items-center justify-center min-h-screen p-4">

    <!-- Standalone Authentication Container (No normal navbar, no normal footer) -->
    <div class="w-full max-w-md bg-white dark:bg-stone-800 p-8 rounded-2xl border border-stone-200 dark:border-stone-700 shadow-2xl space-y-6">
        
        <!-- Clickable Logo → Home 1 (index.html) -->
        <div class="text-center">
            <a href="index.html" class="inline-flex items-center gap-3 group mb-3">
                <div class="w-10 h-10 rounded bg-amber-800/20 border border-amber-600/30 flex items-center justify-center text-amber-600 dark:text-amber-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-xl font-bold tracking-tight text-amber-700 dark:text-amber-500 serif-font">SOLE<span class="text-stone-900 dark:text-stone-100">CRAFT</span></span>
                    <span class="text-[9px] uppercase tracking-widest text-stone-500 dark:text-stone-400 font-semibold -mt-1">Cobbler Workshop</span>
                </div>
            </a>
            <h1 class="text-2xl font-bold serif-font text-stone-900 dark:text-stone-100">Create Client Profile</h1>
            <p class="text-xs text-stone-500 mt-1">Register for fast drop-offs and digital repair tickets</p>
        </div>

        <form action="dashboard.html" method="GET" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-stone-600 dark:text-stone-400 mb-1">Full Name *</label>
                <input type="text" required placeholder="John Doe" class="w-full px-4 py-2.5 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-100 text-sm focus:outline-none focus:border-amber-600">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-stone-600 dark:text-stone-400 mb-1">Mobile Phone *</label>
                <input type="tel" required placeholder="(555) 000-0000" class="w-full px-4 py-2.5 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-100 text-sm focus:outline-none focus:border-amber-600">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-stone-600 dark:text-stone-400 mb-1">Create Password *</label>
                <input type="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-100 text-sm focus:outline-none focus:border-amber-600">
            </div>

            <button type="submit" class="btn-cobbler w-full py-3.5 text-sm font-semibold uppercase tracking-wider">
                Register Client Profile
            </button>
        </form>

        <!-- Social Sign-up Icons -->
        <div class="relative my-4">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-stone-200 dark:border-stone-700"></div></div>
            <div class="relative flex justify-center text-xs uppercase"><span class="bg-white dark:bg-stone-800 px-3 text-stone-500 font-semibold tracking-wider">Or register with</span></div>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <!-- Google -->
            <button type="button" onclick="alert('Google registration connected!')" class="flex items-center justify-center py-2.5 px-3 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 hover:bg-stone-100 dark:hover:bg-stone-700 transition-colors" title="Register with Google">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
            </button>

            <!-- Apple -->
            <button type="button" onclick="alert('Apple ID registration connected!')" class="flex items-center justify-center py-2.5 px-3 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 hover:bg-stone-100 dark:hover:bg-stone-700 transition-colors" title="Register with Apple">
                <svg class="w-5 h-5 fill-current text-stone-900 dark:text-stone-100" viewBox="0 0 24 24">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.96.99-3.1-.96.04-2.14.64-2.83 1.45-.62.72-1.16 1.88-1.01 3 .01 0 .04.01.07.01 1.08 0 2.19-.57 2.78-1.36z"/>
                </svg>
            </button>

            <!-- Facebook -->
            <button type="button" onclick="alert('Facebook registration connected!')" class="flex items-center justify-center py-2.5 px-3 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 hover:bg-stone-100 dark:hover:bg-stone-700 transition-colors" title="Register with Facebook">
                <svg class="w-5 h-5 fill-[#1877F2]" viewBox="0 0 24 24">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </button>
        </div>

        <div class="text-center text-xs text-stone-500 pt-3 border-t border-stone-100 dark:border-stone-700 flex justify-between items-center">
            <a href="index.html" class="text-stone-500 hover:text-amber-600 font-medium">← Back to Home 1</a>
            <a href="login.html" class="text-amber-700 dark:text-amber-400 font-bold hover:underline">Sign In</a>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
