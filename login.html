<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Sign In | SoleCraft Cobbler</title>
    <meta name="description" content="Sign in to view your shoe repair history, active drop-off tickets, and order progress.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        charcoal: '#171513',
                        leather: '#7c4a27',
                        cognac: '#c87d4a',
                        cream: '#fcf9f2',
                        creamDark: '#e8dfd1',
                        brass: '#d4af37',
                        primary: '#c87d4a',
                        secondary: '#171513',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>

<body class="bg-cream dark:bg-charcoal text-stone-800 dark:text-stone-100 transition-colors duration-300 antialiased flex items-center justify-center min-h-screen p-4">

    <!-- Standalone Authentication Container -->
    <div class="w-full max-w-md bg-white dark:bg-stone-800 p-8 rounded-2xl border border-stone-200 dark:border-stone-700 shadow-2xl space-y-6">
        
        <!-- Clickable Logo → Home 1 (index.html) -->
        <div class="text-center">
            <a href="index.html" class="inline-flex items-center gap-3 group mb-3">
                <div class="w-10 h-10 rounded bg-amber-800/20 border border-amber-600/30 flex items-center justify-center text-amber-600 dark:text-amber-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-xl font-bold tracking-tight text-amber-700 dark:text-amber-500 serif-font">SOLE<span class="text-stone-900 dark:text-stone-100">CRAFT</span></span>
                    <span class="text-[9px] uppercase tracking-widest text-stone-500 dark:text-stone-400 font-semibold -mt-1">Cobbler Workshop</span>
                </div>
            </a>
            <h1 class="text-2xl font-bold serif-font text-stone-900 dark:text-stone-100">Client Sign In</h1>
            <p class="text-xs text-stone-500 mt-1">Access your repair history & track active ticket status</p>
        </div>

        <form action="dashboard.html" method="GET" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-stone-600 dark:text-stone-400 mb-1">Mobile Phone or Email *</label>
                <input type="text" required placeholder="(555) 000-0000 or client@example.com" class="w-full px-4 py-2.5 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-100 text-sm focus:outline-none focus:border-amber-600">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold uppercase text-stone-600 dark:text-stone-400">Password *</label>
                    <a href="#" class="text-[11px] text-amber-600 dark:text-amber-400 hover:underline">Forgot password?</a>
                </div>
                <input type="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 text-stone-900 dark:text-stone-100 text-sm focus:outline-none focus:border-amber-600">
            </div>

            <div class="flex items-center justify-between text-xs text-stone-600 dark:text-stone-400">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" checked class="rounded border-stone-400 text-amber-600 focus:ring-amber-500">
                    <span>Remember this device</span>
                </label>
            </div>

            <button type="submit" class="btn-cobbler w-full py-3.5 text-sm font-semibold uppercase tracking-wider">
                Sign In to Account
            </button>
        </form>

        <!-- Social Sign-in Buttons -->
        <div class="relative my-4">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-stone-200 dark:border-stone-700"></div></div>
            <div class="relative flex justify-center text-xs uppercase"><span class="bg-white dark:bg-stone-800 px-3 text-stone-500 font-semibold tracking-wider">Or continue with</span></div>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <!-- Google -->
            <button type="button" onclick="alert('Google sign-in selected')" class="flex items-center justify-center py-2.5 px-3 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 hover:bg-stone-100 dark:hover:bg-stone-700 transition-all shadow-sm group" title="Sign in with Google">
                <svg class="w-5 h-5 group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
            </button>

            <!-- Apple -->
            <button type="button" onclick="alert('Apple ID sign-in selected')" class="flex items-center justify-center py-2.5 px-3 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 hover:bg-stone-100 dark:hover:bg-stone-700 transition-all shadow-sm group" title="Sign in with Apple">
                <svg class="w-5 h-5 fill-current text-stone-900 dark:text-stone-100 group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.96.99-3.1-.96.04-2.14.64-2.83 1.45-.62.72-1.16 1.88-1.01 3 .01 0 .04.01.07.01 1.08 0 2.19-.57 2.78-1.36z"/>
                </svg>
            </button>

            <!-- Facebook -->
            <button type="button" onclick="alert('Facebook sign-in selected')" class="flex items-center justify-center py-2.5 px-3 rounded-lg border border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-900 hover:bg-stone-100 dark:hover:bg-stone-700 transition-all shadow-sm group" title="Sign in with Facebook">
                <svg class="w-5 h-5 fill-[#1877F2] group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </button>
        </div>

        <!-- Social Media Community Links -->
        <div class="pt-4 border-t border-stone-100 dark:border-stone-700 flex flex-col items-center gap-2">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-stone-400 dark:text-stone-500">Connect with Workshop</span>
            <div class="flex items-center gap-3 text-stone-500 dark:text-stone-400">
                <a href="#" class="w-8 h-8 rounded-full bg-stone-100 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 flex items-center justify-center hover:text-amber-600 hover:border-amber-500 transition-all" title="Facebook">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                </a>
                <a href="#" class="w-8 h-8 rounded-full bg-stone-100 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 flex items-center justify-center hover:text-amber-600 hover:border-amber-500 transition-all" title="Instagram">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                </a>
                <a href="https://wa.me/15550192834" target="_blank" class="w-8 h-8 rounded-full bg-stone-100 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 flex items-center justify-center hover:text-emerald-500 hover:border-emerald-500 transition-all" title="WhatsApp">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l.999 1.583-1.077 3.93 4.027-1.056 1.594 1.01z"/></svg>
                </a>
                <a href="#" class="w-8 h-8 rounded-full bg-stone-100 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 flex items-center justify-center hover:text-red-500 hover:border-red-500 transition-all" title="YouTube">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                </a>
            </div>
        </div>

        <div class="text-center text-xs text-stone-500 pt-4 border-t border-stone-100 dark:border-stone-700 flex justify-between items-center">
            <a href="index.html" class="text-stone-500 hover:text-amber-600 font-medium">← Back to Home 1</a>
            <a href="signup.html" class="text-amber-700 dark:text-amber-400 font-bold hover:underline">Create Account</a>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
